name: T07 verification
on:
  push:
    branches: [assignment-7]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
  isolated-postgres-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: t07_runner
          POSTGRES_PASSWORD: t07-ci-only-password
          POSTGRES_DB: plando_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t07_runner -d plando_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://t07_runner:t07-ci-only-password@127.0.0.1:5432/plando_test
      DATABASE_SSL: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run real HTTP tenant isolation against disposable PostgreSQL
        run: npm run test:http
      - name: Inspect T06 and T07 table counts without modifying rows
        if: success()
        run: DATABASE_URL="$TEST_DATABASE_URL" npm run preflight:t07
      - name: Preserve sanitized HTTP verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t07-http-evidence
          path: test-results/t07-http-evidence.json
          if-no-files-found: warn
          retention-days: 14
